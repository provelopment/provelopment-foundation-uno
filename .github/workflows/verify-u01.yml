name: Verify U01 baseline

# Foundation Uno — U01 technical baseline CI.
#
# Two hosts, Node 24, the pinned pnpm 11.6.0, a frozen lockfile, and the full local gate
# set. Read-only: this workflow never deploys, releases, publishes or requests credentials.
# It does not modify the U00 bootstrap workflow, which stays exactly as it was.
#
# The U00 governance gate requires README.md to keep stating that the runtime is not
# implemented yet; this workflow must never be made green by weakening a check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-u01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm 11.6.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Report tool versions
        run: |
          node --version
          pnpm --version
        shell: bash

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      - name: Bootstrap governance gate
        run: pnpm test:bootstrap
        shell: bash

      - name: Architecture boundaries
        run: pnpm test:architecture
        shell: bash

      - name: Lint
        run: pnpm lint
        shell: bash

      - name: Typecheck
        run: pnpm typecheck
        shell: bash

      - name: Unit tests
        run: pnpm test
        shell: bash

      - name: Production build
        run: pnpm build
        shell: bash

      - name: Run production HTTP (technical placeholder)
        run: pnpm test:http
        shell: bash
