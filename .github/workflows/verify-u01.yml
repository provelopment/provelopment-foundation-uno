name: Verify U01 baseline

# Foundation Uno — U01 technical baseline CI.
#
# Two hosts, Node 26, the pinned pnpm 11.6.0, a frozen lockfile, and the full local gate
# set. Read-only: this workflow never deploys, releases, publishes or requests credentials.
# It does not modify the U00 bootstrap workflow, which stays exactly as it was.
#
# The U00 governance gate requires README.md to keep stating that the runtime is not
# implemented yet; this workflow must never be made green by weakening a check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-u01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm 11.6.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      # Blocking proof that the hosted job really runs Node 26 — not merely that a YAML value
      # says so. A silent downgrade to an older major fails the job here, before any gate runs.
      - name: Assert Node 26 runtime
        shell: bash
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 26) { console.error('Expected Node 26, received ' + process.versions.node); process.exit(1); }"

      - name: Verify Owner-frozen governance files (positive and refusal)
        shell: bash
        run: |
          node --test tests/governance-docs.test.mjs
          node scripts/verify-governance-docs.mjs

      - name: Report tool versions
        run: |
          node --version
          pnpm --version
        shell: bash

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      # Hermetic, test-only headless Chromium for the blocking browser proof (UNO-WO-032 / R01). The browser is
      # downloaded into the repository's ignored `.temp/uno-u03-browsers`, so nothing is written to a shared user cache
      # or to an OS package store. `--only-shell` installs exactly the headless shell the proof drives; the
      # dependency-installing variants are deliberately not used, because they would write OS packages outside Uno. No
      # credentials and no provider account are involved: this is tool setup, not a deployment.
      - name: Install pinned headless Chromium (test-only, repo-local)
        run: pnpm exec playwright install --only-shell chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: .temp/uno-u03-browsers

      # Blocking Node 26 / security-floor / analytics-provenance gate (UNO-WO-014 / R01).
      # Node-native and dependency-free: it reads committed text only and fails on a Node 24
      # regression, a missing or drifted security floor, a wrong analytics pin, an unapproved
      # provider, or any bypass marker in the workflow files themselves.
      - name: Node 26 and dependency security floors
        run: node --test tests/deployment/node26-security-floor.test.mjs
        shell: bash

      # Blocking brand and copy gate (UNO-WO-015 / R01): exact visitor copy, retired-claim
      # refusals, SVG validity/sanitisation and header/favicon byte parity.
      - name: Brand and copy contract
        run: node --test tests/deployment/uno-brand-copy.test.mjs
        shell: bash

      # Blocking time-bounded dependency-advisory exception gate (UNO-WO-038 / R03). Exactly one
      # development-only advisory is excepted, by name, against an expiry this guard enforces in
      # code. The guard does not trust the filtered audit: it copies the manifest and lockfile into
      # an isolated, ignore-free workspace, proves the excluded advisory is still present, still HIGH
      # and still unreachable from production, runs a strict production audit with no exemption at
      # all, and refuses as soon as a repaired release is published or any detail drifts.
      - name: Dependency-advisory exception guard tests (expiry, unfiltered, production)
        run: node --test tests/deployment/u04-security-exception.test.mjs
        shell: bash

      - name: Dependency-advisory exception guard (unfiltered and production proof)
        run: node scripts/verify-u04-security-exception.mjs
        shell: bash

      # Corroborating production-only audit: the shipped runtime graph must carry no high or critical
      # advisory whatsoever, independently of the development-only exception above.
      - name: Dependency audit (production graph must be clean)
        run: pnpm audit --prod --audit-level high
        shell: bash

      # Blocking registry-backed audit gate. A HIGH or CRITICAL advisory fails this job; the
      # command is never suffixed with a success-forcing fallback, and no advisory is suppressed.
      # The single authorised exception lives in pnpm-workspace.yaml and is proven still real,
      # still dev-only and still time-bounded by the two steps above.
      - name: Dependency audit (high and critical must be zero)
        run: pnpm audit --audit-level high
        shell: bash

      - name: Bootstrap governance gate
        run: pnpm test:bootstrap
        shell: bash

      - name: Architecture boundaries
        run: pnpm test:architecture
        shell: bash

      - name: Lint
        run: pnpm lint
        shell: bash

      - name: Typecheck
        run: pnpm typecheck
        shell: bash

      - name: Unit tests
        run: pnpm test
        shell: bash

      # Blocking hermetic U04 contract gate (UNO-WO-036 / R02). The browser runner below proves what the product
      # actually renders; this dependency-free test proves that runner's own contract — its mandatory evidence, the
      # absence of any skip or bypass, its fixture restoration, the 27-case transaction suite it reuses — and that the
      # single dark browser context it relies on keeps both the dark colour scheme and reduced motion. It is a separate
      # blocking step on both hosts, because a contract test that never runs in CI cannot fail.
      - name: U04 JSON-slice hermetic contract and refusal tests
        run: node --test tests/deployment/u04-json-slice.test.mjs
        shell: bash

      - name: Production build
        run: pnpm build
        shell: bash

      # Blocking bounded-payload gate (UNO-WO-033 / R01). It reads the build's own `.nft.json` tracing evidence and
      # fails unless the server payload contains exactly the declared deployment inputs and authored sources — no
      # `.documents/`, no private ACTIVE, no `.temp/`, no test harness, no scripts, no public folder, no parent or
      # sibling path. A silently unbounded trace fails here even when the build printed no warning at all.
      - name: Bounded output tracing (committed build)
        run: node scripts/verify-u03-trace.mjs --expect committed
        shell: bash

      - name: Run production HTTP (English demonstration)
        run: pnpm test:http
        shell: bash

      # Blocking U03 fail-closed integration gate (UNO-WO-028 / R01). The committed deployment
      # declares no canonical base and publishes no Page, so every localized address, robots.txt
      # and sitemap.xml must answer a real 404 while `/` keeps its approved copy and noindex.
      # Read-only: no provider call, no deployment, no rewrite and no bypass.
      - name: Run production HTTP (U03 locale and discovery refusals)
        run: node scripts/verify-u03-http.mjs
        shell: bash

      # Blocking fixture-transaction fault-injection gate (UNO-WO-030 / R01). It drives the SAME transaction the
      # positive HTTP gate uses through isolated roots: every preflight refusal, every write position, a failed
      # restore that must fail closed with its recovery copies kept, and scratch hygiene.
      - name: Run fixture transaction fault injection
        run: node --test tests/deployment/u03-fixture-transaction.test.mjs
        shell: bash

      # Blocking positive U03 publication gate (UNO-WO-029 / R01, hardened by UNO-WO-030 and UNO-WO-031 / R01, extended
      # by UNO-WO-032 / R01). It installs a temporary, restore-in-finally synthetic publication fixture, builds and
      # serves the REAL production output on loopback, asserts six published Pages including a custom nested-route
      # Page, truthful locale documents, canonical/hreflang/OG, robots and sitemap, crawler parity, strict refusals and
      # a real headless Chromium DOM at desktop and mobile viewports, then restores the committed declarations
      # byte-for-byte and re-runs the two gates above. The browser path is the same repository-local one installed
      # above, so the proof can never silently fall back to an HTTP-only substitute.
      - name: Run production HTTP and browser (U03 published Pages, restored afterwards)
        run: node scripts/verify-u03-published-http.mjs
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: .temp/uno-u03-browsers

      # Blocking U04 JSON Page vertical-slice gate (UNO-WO-035 / R01). It installs the same restore-in-finally
      # publication fixture, proves the version-1 JSON Page document with the real loader/planner, builds and serves
      # the REAL production output on loopback, then asserts the two-card article grid, truthful locale documents,
      # canonical/OG, the unlisted Page's own `noindex,nofollow` privacy with zero discovery leakage, sixteen
      # distinct refusals as genuine 404s, and a real headless Chromium DOM at 320/390/768/1280 in light and dark with
      # reduced motion, before restoring the committed declarations byte-for-byte and rebuilding them.
      - name: Verify U04 A1 JSON Page vertical slice
        run: node scripts/verify-u04-json-slice.mjs
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: .temp/uno-u03-browsers

      # Offline deployment-readiness gate (UNO-WO-012 / R02). Reads only committed text from
      # this checkout: no network, no provider call, no credential and no deployment. It fails
      # the job if the pinned build inputs, the payload exclusions, the page/robots guards or
      # these CI steps themselves drift or weaken.
      - name: Deployment readiness fixtures (offline, in-memory)
        run: node --test tests/deployment/verify-vercel-readiness.test.mjs
        shell: bash

      - name: Deployment readiness (offline; VERCEL_NOT_DEPLOYED_BY_AGENT)
        run: node scripts/verify-vercel-readiness.mjs
        shell: bash
